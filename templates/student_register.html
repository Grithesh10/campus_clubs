<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | Campus Club Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        body{

            font-family:'Poppins',sans-serif;

            background:linear-gradient(135deg,#0d6efd,#6610f2);

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

        }

        .register-card{

            width:550px;

            border:none;

            border-radius:20px;

            box-shadow:0 20px 40px rgba(0,0,0,.25);

        }

        .college-logo{

            width:90px;

            margin-bottom:10px;

        }

        .btn-primary{

            border-radius:10px;

        }

        .form-control{

            border-radius:10px;

        }

    </style>

</head>

<body>

<div class="card register-card">

<div class="card-body p-4">

<div class="text-center">

<img src="{{ url_for('static', filename='images/college_logo.png') }}"
     class="college-logo">

<h3 class="fw-bold">

AVN Institute of Engineering & Technology

</h3>

<p class="text-muted">

Campus Club Portal

</p>

<hr>

<h4>

Student Registration

</h4>

</div>

{% if error %}

<div class="alert alert-danger">

{{ error }}

</div>

{% endif %}

<form method="POST">

<div class="mb-3">

<label class="form-label">

Full Name

</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">

Roll Number

</label>

<input
type="text"
name="roll_number"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">

Email

</label>

<input
type="email"
name="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">

Department

</label>

<input
type="text"
name="department"
class="form-control"
placeholder="AI & DS"
required>

</div>

<div class="mb-3">

<label class="form-label">

Year

</label>

<select
name="year"
class="form-select">

<option value="1st Year">1st Year</option>

<option value="2nd Year">2nd Year</option>

<option value="3rd Year">3rd Year</option>

<option value="4th Year">4th Year</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">

Password

</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<div class="d-grid">

<button class="btn btn-primary btn-lg">

<i class="bi bi-person-plus-fill"></i>

Register

</button>

</div>

</form>

<hr>

<div class="text-center">

Already have an account?

<a href="{{ url_for('student_login') }}">

Student Login

</a>

</div>

<div class="text-center mt-2">

<a href="{{ url_for('login') }}">

Admin Login

</a>

</div>

</div>

</div>

</body>

</html>
