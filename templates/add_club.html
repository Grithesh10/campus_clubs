{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Add New Club</h2>

    <form method="POST" enctype="multipart/form-data"></form>

        <div class="mb-3">

    <label class="form-label">
        Club Logo
    </label>

    <input
        type="file"
        name="logo"
        class="form-control"
        accept=".png,.jpg,.jpeg"
        required>

</div>
        <div class="mb-3">
            <label class="form-label">Category</label>
            <input
                type="text"
                name="category"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea
                name="description"
                class="form-control"
                rows="4"
                required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Logo Filename</label>
            <input
                type="text"
                name="logo"
                class="form-control"
                placeholder="Example: literary_club.png"
                required>
        </div>

        <button type="submit" class="btn btn-primary">
            Save Club
        </button>

    </form>

</div>

{% endblock %}
