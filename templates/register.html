{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow p-4">

        <h2 class="mb-4">Student Registration</h2>

        <form method="POST">

            <div class="mb-3">
                <label>Name</label>
                <input type="text" name="student_name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Roll Number</label>
                <input type="text" name="roll_number" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Club</label>

                <select name="club_name" class="form-select">

                    {% for club in clubs %}

                    <option>{{ club.club_name }}</option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">
                <label>Event</label>

                <select name="event_name" class="form-select">

                    {% for event in events %}

                    <option>{{ event.event_name }}</option>

                    {% endfor %}

                </select>

            </div>

            <button class="btn btn-success">
                Register
            </button>

        </form>

    </div>

</div>

{% endblock %}
