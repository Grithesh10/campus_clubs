<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Campus Club Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{

            margin:0;

            height:100vh;

            font-family:'Poppins',sans-serif;

            background:linear-gradient(135deg,#0d6efd,#0b5ed7);

            overflow:hidden;

        }

        .watermark{

            position:absolute;

            width:450px;

            opacity:.08;

            top:50%;

            left:50%;

            transform:translate(-50%,-50%);

        }

        .card-box{

            background:white;

            padding:45px;

            border-radius:20px;

            box-shadow:0 10px 30px rgba(0,0,0,.25);

            text-align:center;

            position:relative;

            z-index:2;

        }

        .logo{

            width:110px;

            margin-bottom:15px;

        }

        h1{

            font-weight:700;

        }

        h5{

            color:#666;

        }

        .btn{

            padding:12px;

            font-size:18px;

            border-radius:10px;

        }

    </style>

</head>

<body>

<img src="{{ url_for('static', filename='images/college_logo.png') }}"
     class="watermark">

<div class="container h-100">

    <div class="row h-100 justify-content-center align-items-center">

        <div class="col-md-6">

            <div class="card-box">

                <img src="{{ url_for('static', filename='images/college_logo.png') }}"
                     class="logo">

                <h3 class="fw-bold">
                    AVN Institute of Engineering & Technology
                </h3>

                <h1 class="text-primary mt-3">
                    Campus Club Portal
                </h1>

                <p class="text-muted">
                    Manage Clubs • Events • Student Registrations
                </p>

                <div class="d-grid gap-3 mt-4">

                    <a href="{{ url_for('login') }}"
                       class="btn btn-primary">

                        <i class="bi bi-shield-lock-fill"></i>

                        Admin Login

                    </a>

                    <a href="{{ url_for('student_login') }}"
                       class="btn btn-success">

                        <i class="bi bi-person-fill"></i>

                        Student Login

                    </a>

                    <a href="{{ url_for('student_register') }}"
                       class="btn btn-outline-dark">

                        <i class="bi bi-person-plus-fill"></i>

                        New Student Registration
                        <a href="{{ url_for('student_register') }}" class="btn btn-success">
  
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
